services:
  - type: web
    name: voice-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback: without this, a direct browser navigation to /demo
    # (rather than a client-side <Link> click from /) 404s, since there's
    # no actual /demo file on disk -- only index.html, with react-router
    # deciding what to render based on the URL client-side.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points the deployed frontend at the live backend (Hugging Face
      # Space). Update this if the Space is ever renamed or redeployed
      # elsewhere.
      - key: VITE_API_URL
        value: https://simrunnn-call-support.hf.space
